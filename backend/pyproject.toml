[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-triage-agent"
version = "0.1.0"
description = "Evidence-first autonomous-driving disengagement triage POC"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "networkx>=3.3,<4",
  "httpx>=0.27,<1",
  "openai>=1.55,<2",
  "langgraph>=1.0.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langchain-core>=1,<2",
  "langchain-openai>=1,<2",
  "mlflow>=3,<4",
  "qdrant-client[fastembed]>=1.14,<2",
  "metadrive-simulator @ git+https://github.com/metadriverse/metadrive.git",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["knowledge/*.json", "knowledge/documents/*.json", "knowledge/documents/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
